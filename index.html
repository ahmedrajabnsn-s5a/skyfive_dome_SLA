<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>A2G SLA Monitor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#050b18;--panel:rgba(12,24,48,.72);--line:rgba(120,200,255,.22);--ink:#e6f2ff;--mute:#8aa6c8;--cy:#38d6ff;--vi:#8b7bff;--bad:#ff6b8b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 20% 10%,#0d2350 0%,transparent 60%),radial-gradient(900px 600px at 90% 90%,#1b0f45 0%,transparent 60%),var(--bg);
 color:var(--ink);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
.grid{position:fixed;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;opacity:.18;mask-image:radial-gradient(circle at 50% 50%,#000 0%,transparent 70%)}
.orbit{position:fixed;width:720px;height:720px;left:50%;top:50%;margin:-360px 0 0 -360px;border-radius:50%;border:1px dashed rgba(56,214,255,.18);animation:spin 60s linear infinite}
.orbit::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--cy);box-shadow:0 0 18px var(--cy);top:-5px;left:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.card{position:relative;width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px 30px 26px;backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);text-align:center}
.logo{height:62px;filter:drop-shadow(0 0 14px rgba(56,214,255,.45))}
h1{font:700 22px/1.2 Oxanium,sans-serif;letter-spacing:.06em;margin:18px 0 4px;background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:13px;margin:0 0 24px}
label{display:block;text-align:left;font-size:12px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.f{position:relative}
input{width:100%;padding:13px 44px 13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(3,10,24,.8);color:var(--ink);font:15px 'IBM Plex Sans',sans-serif;outline:none;transition:border .2s,box-shadow .2s}
input:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(56,214,255,.18)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px;padding:6px}
button.go{margin-top:16px;width:100%;padding:13px;border:0;border-radius:12px;font:700 14px Oxanium,sans-serif;letter-spacing:.1em;color:#04121f;background:linear-gradient(90deg,var(--cy),var(--vi));cursor:pointer;box-shadow:0 8px 24px rgba(56,214,255,.25)}
button.go:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--mute)}.msg.bad{color:var(--bad)}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.foot{margin-top:18px;font-size:11px;color:var(--mute);opacity:.8}
</style></head>

  <h1>A2G SLA MONITOR</h1>
  <p class="sub">Availability &amp; throughput service levels · restricted access</p>
  <label for="pw">Password</label>
  <div class="f"><input id="pw" type="password" autocomplete="current-password" required autofocus><button type="button" class="eye" id="eye" aria-label="Show password">&#128065;</button></div>
  <button class="go" id="go" type="submit">UNLOCK DASHBOARD</button>
  <div class="msg" id="msg"></div>
  <div class="foot">Data is encrypted · the password never leaves your browser</div>
</form>
<script>
(()=>{
const ITER=310000,$=s=>document.querySelector(s),msg=$('#msg');
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let BLOB=null;const blob=()=>BLOB||(BLOB=fetch('app.bin',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('load '+r.status);return r.arrayBuffer()}).then(b=>new Uint8Array(b)));
async function gunzip(buf){const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));return new Response(s).text()}
async function open_(raw){const u=await blob();const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(16,28)},k,u.slice(28));const html=await gunzip(pt);
  sessionStorage.setItem('slaK',b64(raw));document.open();document.write(html);document.close()}
async function derive(pw){const u=await blob();const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:u.slice(0,16),iterations:ITER},base,256)}
$('#eye').onclick=()=>{const i=$('#pw');i.type=i.type==='password'?'text':'password'};
$('#f').onsubmit=async e=>{e.preventDefault();const go=$('#go');go.disabled=true;msg.className='msg';msg.textContent='Verifying…';
  try{const raw=await derive($('#pw').value);msg.textContent='Decrypting dashboard…';await open_(raw)}
  catch(err){go.disabled=false;msg.className='msg bad';msg.textContent=String(err&&err.message||'').startsWith('load')?'Could not load the dashboard data — try again.':'Incorrect password';
    const c=$('#f');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');$('#pw').select()}};
(async()=>{const s=sessionStorage.getItem('slaK');if(!s)return;msg.textContent='Opening…';try{await open_(unb64(s))}catch(e){sessionStorage.removeItem('slaK');msg.textContent=''}})();
blob().catch(()=>{});
})();
</script>
